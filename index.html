<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kOwOdni</title>
    <link rel="stylesheet" href="styles.css" >
</head>
<body id="HTML_body" style="font-family:Calibri, Consolas, 'Gill Sans', 'Gill Sans MT', 'Trebuchet MS', sans-serif;">
    <div class="centerRow">
        <canvas id="kanvas" width="401" height="401"></canvas>
    </div>
    <div style="height: 80px;"></div>
    <div class="centerRow" id="field_SettingsRow" >
        <div class="settingsBox" style="width:300px;height:300px;color:white;">
            <font style="font-size:25px;">Resonance frequency & Mode Functions </font><br>
            <br>
            <textarea id="field_ResMode" style="background-color: transparent;border-style: solid 1px;color:white;width:250px;height:200px;resize:none;" ></textarea>
        </div>
        <div class="settingsBox" style="width:350px;height:300px;color:white;">
            <font style="font-size:25px;">Other Settings </font><br>
            <br>
            X min max Range : <input type="number" id="field_plotXmin" style="width:80px" value="-1"> ~ <input type="number" id="field_plotXmax" style="width:80px" value="1">  <br>
            Y min max Range : <input type="number" id="field_plotYmin" style="width:80px" value="-1"> ~ <input type="number" id="field_plotYmax" style="width:80px" value="1">  <br>
            Slice Height : <input type="number" id="field_plotZheight" style="width:80px" value="0.05"> <br>
            Color R : <input type="number" id="field_color_R" style="width:80px" value="255"> <br>
            Color G : <input type="number" id="field_color_G" style="width:80px" value="255"> <br>
            Color B : <input type="number" id="field_color_B" style="width:80px" value="255"> <br>
        </div>
    </div>
    <script src="main.js"></script>
</body>
